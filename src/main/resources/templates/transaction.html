<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Relation</title>
    <style>
        body {
            font-size : 25px;
            font-family : sans-serif;
        }

        .header {
            display : flex;
            justify-content : space-between;
            width : 90%;
            margin : 50px auto;
        }

        a {
            text-decoration : none;
            color : black;
            margin-left : 50px;
        }

        .linkActive {
            color : blue;
        }

        .bodyPlace {
            width : 87%;
            margin : 135px auto;
        }

        .transactionForm {
            margin-bottom : 150px;
        }

        .inputAmount {
            width : 150px;
            border : 1px solid #ededed;
            border-radius : 10px;
            box-shadow : 0px 0px 0px 1px #ededed;
            height : 110px;
            padding : 20px
        }

        .inputDescription {
            width : 550px;
            border : 1px solid #ededed;
            border-radius : 10px;
            box-shadow : 0px 0px 0px 1px #ededed;
            height : 80px;
            padding-left : 10px;
            margin-right : 60px;
        }

        .selectRelationShip {
            width : 550px;
            border : 1px solid #ededed;
            border-radius : 10px;
            box-shadow : 0px 0px 0px 1px #ededed;
            height : 80px;
            padding-left : 10px;
            margin-right : 60px;
        }

        .btn-primary {
            color : white;
            height : 90px;
            margin-top : -150px;
            margin-left : 91%;
            font-size : 25px;
            width : 130px;
        }

        .formRelationShip {
            margin : auto;
            width : 60%;
        }

        label {
            display : grid;
        }

        .transactionHistoric {
            border : 1px solid #ededed;
            border-radius : 10px;
            box-shadow : 0px 0px 0px 1px #ededed;
            width : 100%;
        }

        .transactionTitle {
            display : block;
            margin-top : 25px;
            margin-left : 25px;
        }

        .namesColumns {
            display : flex;
            height : 50px;
        }

        .widthColumns {
            width : 33%;
        }

        .widthResults {
            display : flex;
            align-content : space-between;
            margin-left : 25px;
            padding-bottom : 100px;
            margin-right : 15px;
        }

        .relationsColumns {
            display : block;
            margin-left : 25px;
            border-bottom : 1px solid #ededed;
            height : 50px;
        }

        .descriptionsColumns {
            display : block;
            border-bottom : 1px solid #ededed;
            height : 50px;
            padding-left : 15px;
        }

        .amountsColumns {
            text-align : end;
            border-bottom : 1px solid #ededed;
            height : 50px;
            margin-right : 15px;
        }

        .relationsResults {
            margin-top : 10px;
            margin-bottom : 0;
            height : 50px;
        }

        .descriptionsResults {
            margin-top : 10px;
            margin-bottom : 0;
            height : 50px;
        }

        .amountsResults {
            margin-top : 10px;
            margin-bottom : 0;
            height : 50px;
            text-align : end;
        }

        .relationsDiv {
            display : flex;
            flex-direction : column;
            width : 33%;
        }

        .descriptionsDiv {
            display : flex;
            flex-direction : column;
            width : 33%;
        }

        .amountsDiv {
            display : flex;
            flex-direction : column;
            width : 33%;
        }

        .underline {
            border-bottom : 1px solid #ededed;
        }
    </style>
</head>
<body>
<div class="header">
    <p>Pay My Buddy</p>
    <nav>
        <a th:href="@{/transaction}" class="linkActive">Transférer</a>
        <a th:href="@{/profil}">Profil</a>
        <a th:href="@{/relationship}">Ajouter relation</a>
        <a th:href="@{/logout}">Se déconnecter</a>
    </nav>
</div>
<div class="bodyPlace">
    <div class="transactionForm">
        <form class="addTransaction" method="post" action="/transaction">
            <select class="selectRelationShip" name="email">
                <option>Sélectionner une relation</option>
                <option th:each="email : ${emailFriendsList}" th:value="${email}" th:text="${email}"></option>
            </select>
            <input class="inputDescription" type="text" name="description" placeholder="Description">
            <input class="inputAmount" type="number" name="amount" placeholder="0€" step="0.01" min="0" value="€">
            <button class="btn btn-primary" type="submit">Payer</button>
        </form>
    </div>
    <div class="transactionHistoric">
        <div>
            <p class="transactionTitle">Mes transactions</p>
        </div>
        <div class="namesColumns">
            <div class="widthColumns">
                <p class="relationsColumns">Relations</p>
            </div>
            <div class="widthColumns">
                <p class="descriptionsColumns">Description</p>
            </div>
            <div class="widthColumns">
                <p class="amountsColumns">Montant</p>
            </div>
        </div>
        <div class="widthResults">
            <div class="relationsDiv">
                <div class="underline" th:each="receiver : ${receivers}">
                    <p class="relationsResults" th:text="${receiver}"></p>
                </div>
            </div>
            <div class="descriptionsDiv">
                <div class="underline" th:each="description : ${descriptions}">
                    <p class="descriptionsResults" th:text="${description}"></p>
                </div>
            </div>
            <div class="amountsDiv">
                <div class="underline" th:each="amount : ${amounts}">
                    <p class="amountsResults" th:text="${amount}"></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
