<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Créer un compte</title>

    <style>
        .btn-warning {
            color : white;
            font-size : 20px;
            font-family : sans-serif;
            font-weight : bold;
            width : 185px;
            height : 55px;
            margin : 20px 57px;
            padding-top : 10px;
        }

        .btn-primary {
            font-size : 20px;
            font-family : sans-serif;
            font-weight : bold;
            width : 185px;
            height : 55px;
            margin : 20px 57px;
        }

        .sign {
            border : 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            position : absolute;
            top : 15%;
            bottom : 15%;
            right : 38%;
            left : 38%;
        }

        .formulaire {
            height : 560px;
            width : 300px;
        }

        .username {
            margin-top : 15%;
            margin-left : 25px;
            width : 250px;
            height : 50px;
        }

        .mail {
            margin-top : 20px;
            margin-left : 25px;
            width : 250px;
            height : 50px;
        }

        .password {
            margin-top : 20px;
            margin-bottom : 25%;
            margin-left : 25px;
            width : 250px;
            height : 50px;
        }
    </style>

</head>
<body>
<div class="sign">
    <form class="formulaire" method="post" action="/registration">
        <a th:href="@{/login}" class="btn btn-warning">Pay My Buddy</a>
        <div>
            <input class="form-control username" type="text" name="username" placeholder="username">
        </div>
        <div>
            <input class="form-control mail" type="email" name="email" placeholder="Mail">
        </div>
        <div>
            <input class="form-control password" type="password" name="password" placeholder="Mot de passe">
        </div>
        <button class="btn btn-primary" type="submit">S'inscrire</button>
    </form>
</div>
</body>
</html>
