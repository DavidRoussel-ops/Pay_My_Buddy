<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Relation</title>
    <style>
        body {
            font-size : 25px;
            font-family : sans-serif;
        }

        .header {
            display : flex;
            justify-content : space-between;
            width : 90%;
            margin : 50px auto;
        }

        a {
            text-decoration : none;
            color : black;
            margin-left : 50px;
        }

        .linkActive {
            color : blue;
        }

        .bodyPlace {
            width : 60%;
            margin : 300px auto;
        }

        .inputEmail {
            width : 500px;
            border : 1px solid #ededed;
            border-radius : 10px;
            box-shadow : 0px 0px 0px 1px #ededed;
            height : 50px;
            margin-top : 5px;
        }

        .btn-warning {
            color : white;
            height : 55px;
            margin-top : -135px;
            margin-left : 515px;
            font-size : 25px;
            width : 130px;
        }

        .formRelationShip {
            margin : auto;
            width : 60%;
        }

        label {
            display : grid;
        }

        .errorDiv {
            width : 52%;
            margin : auto;
        }

        .errorText {
            color : red;
        }
    </style>
</head>
<body>
    <div class="header">
        <p>Pay My Buddy</p>
        <nav>
            <a th:href="@{/transaction}">Transférer</a>
            <a th:href="@{/profil}">Profil</a>
            <a th:href="@{/relationship}" class="linkActive">Ajouter relation</a>
            <a th:href="@{/logout}">Se déconnecter</a>
        </nav>
    </div>
    <div class="bodyPlace">
        <form th:if="${session.user != null}" class="formRelationShip" method="post" action="/relationship">
            <div>
                <label>Chercher une relation
                    <input class="inputEmail" type="email" name="email" placeholder="  Saisir une adresse mail">
                </label>
            </div>
            <button class="btn btn-warning" type="submit">Ajouter</button>
        </form>
    </div>
    <div class="errorDiv" th:if="${error}">
        <p class="errorText" th:text="${error}"></p>
    </div>
</body>
</html>
