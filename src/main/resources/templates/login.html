<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>PayMyBuddy</title>

    <style>
        .btn-warning {
            color : white;
            margin : 20% 10%;
            font-size : 20px;
            font-family : sans-serif;
            font-weight : bold;
        }

        .btn-primary {
            margin : 20% 10%;
            font-size : 20px;
            font-family : sans-serif;
            font-weight : bold;
        }

        .log {
            border : 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            margin : 5% 35%;
        }

        .formulaire {
            margin : 5%;
            justify-content : center;
            align-items: center;
        }

        .form-control {
            margin-top : 20%;
            margin-bottom : 20%;
        }
    </style>

</head>
<body>
<div class="log">
    <form class="formulaire" method="post" action="/login">
        <button class="btn btn-warning">Pay My Buddy</button>
        <div>
            <input class="form-control" type="text" name="username" placeholder="Mail">
        </div>
        <div>
            <input class="form-control" type="password" name="password" placeholder="Mot de passe">
        </div>
        <button class="btn btn-primary" type="submit">Se connecter</button>
    </form>
</div>
</body>
</html>
