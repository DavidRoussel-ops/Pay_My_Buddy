<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Connexion</title>

    <style>
        .btn-warning {
            color : white;
            font-size : 20px;
            font-family : sans-serif;
            font-weight : bold;
            width : 185px;
            height : 55px;
            margin : 20px 57px;
            padding-top : 10px;
        }

        .btn-primary {
            font-size : 20px;
            font-family : sans-serif;
            font-weight : bold;
            width : 185px;
            height : 55px;
            margin : 20px 57px;
        }

        .log {
            border : 1px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            position : absolute;
            top : 15%;
            bottom : 15%;
            right : 38%;
            left : 38%;
        }

        .formulaire {
            height : 560px;
            width : 300px;
        }

        .username {
            margin-top : 30%;
            margin-left : 25px;
            width : 250px;
            height : 50px;
        }

        .password {
            margin-top : 10%;
            margin-bottom : 30%;
            margin-left : 25px;
            width : 250px;
            height : 50px;
        }

        .errorDiv {
            width : 52%;
            margin : auto;
        }

        .errorText {
            color : red;
        }
    </style>

</head>
<body>
    <div class="log">
        <form class="formulaire" method="post" action="/login">
            <a th:href="@{/registration}" class="btn btn-warning">Pay My Buddy</a>
            <div>
                <input class="form-control username" type="text" name="username" placeholder="Mail">
            </div>
            <div>
                <input class="form-control password" type="password" name="password" placeholder="Mot de passe">
            </div>
            <button class="btn btn-primary" type="submit">Se connecter</button>
        </form>
    </div>
    <div class="errorDiv" th:if="${error}">
        <p class="errorText" th:text="${error}"></p>
    </div>
</body>
</html>
