<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Profile</title>
    <style>
        .header {
            display : flex;
            justify-content : space-between;
            width : 90%;
            margin : 50px auto;
        }

        a {
            text-decoration : none;
            color : black;
            margin-left : 30px;
        }

        .linkActive {
            color : blue;
        }

        .bodyPlace {
            width : 60%;
            margin : 250px auto;
            display : flex;
        }

        .inputUsername {
            margin-left : 50px;
            border : 0;
        }

        .inputEmail {
            margin-left : 90px;
            border : 0;
        }

        .inputPassword {
            margin-left : 25px;
            border : 0;
        }

        .btn-warning {
            color : white;
            height : 50px;
            margin-top : 55px;
            margin-left : 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <p>Pay My Buddy</p>
        <nav>
            <a href="#">Transférer</a>
            <a th:href="@{/profil}" class="linkActive">Profil</a>
            <a href="#">Ajouter relation</a>
            <a th:href="@{/logout}">Se déconnecter</a>
        </nav>
    </div>
    <div class="bodyPlace">
        <form th:if="${session.user != null}" class="formUpdate" method="post">
            <div>
                <label>Username
                    <input class="inputUsername" type="text" name="username" placeholder="@username  >">
                </label>
            </div>
            <div>
                <label>Mail
                    <input class="inputEmail" type="email" name="email" placeholder="nom@domain.com        >">
                </label>
            </div>
            <div>
                <label>Mot de passe
                    <input class="inputPassword" type="password" name="password" placeholder="mot de passe                 >">
                </label>
            </div>
        </form>
        <button class="btn btn-warning">Modifier</button>
    </div>
</body>
</html>
